[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "confidential-compute-demo"
version = "0.2.0"
description = "Working confidential-computing primitives: Paillier homomorphic analytics, secret-sharing MPC, and remote attestation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Vincent Plessy" }]
dependencies = [
  "cryptography>=44,<46",
  "fastapi>=0.139,<1",
  "pydantic>=2.13,<3",
  "uvicorn[standard]>=0.51,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.5,<3",
  "mypy>=1.20,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=7.1,<8",
  "ruff>=0.15,<1",
]

[project.scripts]
ccdemo = "confidential_compute_demo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/confidential_compute_demo"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures/ground-truth.json" = "confidential_compute_demo/data/ground-truth.json"
"uv.lock" = "confidential_compute_demo/data/uv.lock"
"web/app.js" = "confidential_compute_demo/web/app.js"
"web/index.html" = "confidential_compute_demo/web/index.html"
"web/style.css" = "confidential_compute_demo/web/style.css"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/fixtures",
  "/web",
  "/scripts",
  "/benchmarks",
  "/docs",
  "/.github/workflows/ci.yml",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/Dockerfile",
  "/docker-compose.yml",
  "/Makefile",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["confidential_compute_demo"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
# S311: the demos deliberately drive key generation and secret sharing from a
# seeded, non-cryptographic PRNG so every run is byte-reproducible. These are
# demonstration keys, never for real data; SECURITY.md and the module docstrings
# state that loudly. Determinism, not secrecy, is the goal here.
ignore = ["S101", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["confidential_compute_demo"]
